[package]
name = "airfry"
version = "0.1.0"
edition = "2021"
description = "AirFry — a native Linux AirPlay screen-mirroring sender for Apple TV"
license = "MIT"

[[bin]]
name = "airfry"
path = "src/main.rs"

[dependencies]
fpemu = { path = "../fpemu" }
mdns-sd = "0.11"
anyhow = "1"

# pairing / transport crypto
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
aes = "0.8"
ctr = "0.9"
